name: Build & Release Jellyfin Plugin

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Verify discovery safety
        run: dotnet run --project Tests/DiscoveryTests.csproj -c Release

      - name: Package Plugin Zip
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* || -z "$VERSION" ]]; then
            VERSION="1.0.0.0"
          fi
          ZIP_NAME="Torr2Jelly_${VERSION}.zip"
          mkdir -p dist
          cp bin/Release/net8.0/Jellyfin.Plugin.Torr2Jelly.dll dist/
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd ..
          CHECKSUM=$(md5sum "${ZIP_NAME}" | awk '{ print $1 }')
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_name }}
          generate_release_notes: true
